[package]
name = "essenty-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Web/WASM adapter for the Essenty Rust runtime (visibility, history, storage)."
categories.workspace = true
keywords.workspace = true

[dependencies]
essenty-lifecycle = { workspace = true }
essenty-state-keeper = { workspace = true }
essenty-back-handler = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Event",
    "EventTarget",
    "History",
    "Location",
    "PopStateEvent",
    "PageTransitionEvent",
    "Storage",
    "VisibilityState",
    "Window",
] }

[lints]
workspace = true
