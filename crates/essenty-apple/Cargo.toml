[package]
name = "essenty-apple"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Apple-family adapter for the Essenty Rust runtime (iOS, macOS, watchOS, tvOS, visionOS, Mac Catalyst)."
categories.workspace = true
keywords.workspace = true

[dependencies]
essenty-lifecycle = { workspace = true }
essenty-state-keeper = { workspace = true }
essenty-back-handler = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "NSString"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder"] }

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "NSString"] }
objc2-ui-kit = { version = "0.3.2", features = ["UIApplication", "UIResponder"] }

[target.'cfg(target_os = "watchos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "NSString"] }

[lints.rust]
# Objective-C notification registration requires localized unsafe calls.
unsafe_code = "allow"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = "warn"
pedantic = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
