[package]
name = "essenty-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Android adapter for the Essenty Rust runtime (Activity lifecycle, saved state, back dispatch)."
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[features]
default = []
# Integration with Rust NativeActivity hosts built using android-activity.
native-activity = [
    "dep:android-activity",
    "dep:jni",
    "dep:jni-min-helper",
    "dep:log",
    "android-activity/native-activity",
]

[dependencies]
essenty-lifecycle = { workspace = true }
essenty-state-keeper = { workspace = true }
essenty-back-handler = { workspace = true }

# Platform-specific dependencies must stay behind a target gate so core hosts
# (macOS, Linux, Windows, WASM, Apple) never pay for Android/JNI graphs.
# Future JNI integration (e.g. `jni`) belongs here, for example:
# [target.'cfg(target_os = "android")'.dependencies]
# jni = { version = "0.21", default-features = false }
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", default-features = false, optional = true }
jni = { version = "0.22.4", default-features = false, optional = true }
jni-min-helper = { version = "0.4.7", optional = true }
log = { version = "0.4", optional = true }

[lints]
workspace = true
