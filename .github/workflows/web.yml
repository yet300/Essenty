name: Web

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  web-host-tests:
    name: Web crate host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/rust-cache@v2
      - run: cargo test -p essenty-web --all-features

  wasm-check:
    name: wasm32-unknown-unknown (cargo check, compile-tested)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: rust-lang/rust-cache@v2
      - run: cargo check --workspace --target wasm32-unknown-unknown
